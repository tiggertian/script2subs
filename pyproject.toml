[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "script2subs"
version = "0.2.0"
description = "Verbatim bilingual subtitles: align a hand-authored script to AutoSubs word timings and export Resolve-ready SRTs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Script2Subs contributors" }]
keywords = [
  "subtitles", "srt", "bilingual", "davinci-resolve", "autosubs",
  "forced-alignment", "captions",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing",
]
dependencies = []

[project.optional-dependencies]
ui = ["pywebview>=5.0"]
dev = ["pytest>=8"]

[project.scripts]
script2subs = "script2subs.cli:main"

[tool.setuptools.packages.find]
include = ["script2subs*"]

[tool.setuptools.package-data]
"script2subs.ui" = ["static/*"]
